name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # "brands" checks for an entry in home-assistant/brands, which is a
          # requirement for inclusion in the HACS DEFAULT store, not for
          # installing this as a custom repository. Ignored deliberately.
          # Drop this line if you ever submit the icon PR to
          # home-assistant/brands and apply for default listing.
          ignore: brands
